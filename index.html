<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Resume Builder - Veenit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .resume-preview { box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25); }
    .section-item { transition: all 0.2s; }
    @media print {
      .no-print { display: none !important; }
      body { background: white; }
      .resume-preview { box-shadow: none; margin: 0; width: 100%; max-width: 100%; }
    }
  </style>
</head>
<body class="bg-gray-50">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="bg-white border-b sticky top-0 z-50 no-print">
      <div class="px-8 py-4 flex items-center justify-between">
        <h1 class="text-3xl font-bold text-gray-900 flex items-center gap-3">
          <i class="fas fa-robot text-blue-600"></i> AI Resume Builder
        </h1>
        <div class="flex gap-3">
          <button onclick="loadSampleData()" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 rounded-2xl font-medium flex items-center gap-2">
            <i class="fas fa-magic"></i> Sample
          </button>
          <button onclick="exportPDF()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-semibold flex items-center gap-2">
            <i class="fas fa-download"></i> PDF
          </button>
        </div>
      </div>
    </div>

    <div class="flex h-[calc(100vh-73px)]">
      <!-- Editor -->
      <div class="w-96 bg-white border-r overflow-auto p-6 space-y-8 no-print">
        <h2 class="text-2xl font-semibold flex items-center gap-2">
          <i class="fas fa-edit"></i> Editor
        </h2>

        <!-- Personal -->
        <div class="space-y-4">
          <h3 class="font-medium text-lg">Personal Info</h3>
          <input id="name" placeholder="Full Name" class="w-full p-3 border rounded-2xl" oninput="updatePreview()">
          <input id="title" placeholder="Job Title" class="w-full p-3 border rounded-2xl" oninput="updatePreview()">
          <input id="email" placeholder="Email" class="w-full p-3 border rounded-2xl" oninput="updatePreview()">
          <input id="phone" placeholder="Phone" class="w-full p-3 border rounded-2xl" oninput="updatePreview()">
        </div>

        <!-- Summary -->
        <div>
          <h3 class="font-medium text-lg mb-2">Professional Summary</h3>
          <textarea id="summary" rows="4" class="w-full p-3 border rounded-2xl" oninput="updatePreview()"></textarea>
          <button onclick="improveWithAI()" class="mt-2 text-blue-600 hover:underline text-sm flex items-center gap-1">
            <i class="fas fa-sparkles"></i> Improve with AI
          </button>
        </div>

        <!-- Experience -->
        <div>
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-medium text-lg">Experience</h3>
            <button onclick="addExperience()" class="text-blue-600 text-sm"><i class="fas fa-plus"></i> Add</button>
          </div>
          <div id="experience-list" class="space-y-3"></div>
        </div>

        <div class="pt-6 border-t">
          <p class="text-xs text-gray-500">More sections (Education, Skills, Projects) will be added in next upgrade.</p>
        </div>
      </div>

      <!-- Preview -->
      <div class="flex-1 p-8 bg-gray-100 overflow-auto flex items-start justify-center">
        <div id="preview" class="resume-preview bg-white w-full max-w-2xl p-10 text-sm">
          <!-- Dynamic Content -->
          <div class="text-center border-b pb-8 mb-8">
            <h1 id="preview-name" class="text-4xl font-bold text-gray-900"></h1>
            <p id="preview-title" class="text-xl text-gray-600 mt-1"></p>
            <div class="flex justify-center gap-6 mt-4 text-gray-600">
              <span id="preview-email"></span>
              <span id="preview-phone"></span>
            </div>
          </div>
          
          <div id="preview-summary-section" class="mb-8"></div>
          
          <div id="preview-experience" class="mb-8"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let experiences = [];

    function updatePreview() {
      // Personal
      document.getElementById('preview-name').textContent = document.getElementById('name').value || "Your Name";
      document.getElementById('preview-title').textContent = document.getElementById('title').value || "Professional Title";
      document.getElementById('preview-email').textContent = document.getElementById('email').value;
      document.getElementById('preview-phone').textContent = document.getElementById('phone').value;

      // Summary
      const summary = document.getElementById('summary').value;
      document.getElementById('preview-summary-section').innerHTML = summary ? `
        <h2 class="uppercase text-xs tracking-widest font-semibold text-gray-500 mb-3">PROFESSIONAL SUMMARY</h2>
        <p class="text-gray-700 leading-relaxed">${summary}</p>
      ` : '';

      // Experience
      let expHTML = `<h2 class="uppercase text-xs tracking-widest font-semibold text-gray-500 mb-4">EXPERIENCE</h2>`;
      experiences.forEach((exp, i) => {
        expHTML += `
          <div class="mb-6">
            <div class="flex justify-between">
              <h3 class="font-semibold">${exp.company}</h3>
              <span class="text-gray-500">${exp.period}</span>
            </div>
            <p class="text-gray-600">${exp.role}</p>
            <ul class="list-disc ml-5 mt-2 text-gray-700">
              ${exp.bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>`;
      });
      document.getElementById('preview-experience').innerHTML = expHTML;

      // Auto save
      localStorage.setItem("resumeData", JSON.stringify({
        name: document.getElementById('name').value,
        title: document.getElementById('title').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        summary: document.getElementById('summary').value,
        experiences: experiences
      }));
    }

    function addExperience() {
      const company = prompt("Company Name:");
      if (!company) return;
      const role = prompt("Job Role:");
      const period = prompt("Period (e.g. Jan 2023 - Present):");
      const bullets = [prompt("Bullet Point 1:") || "Led key initiatives"];

      experiences.push({ company, role, period, bullets });
      renderExperienceList();
      updatePreview();
    }

    function renderExperienceList() {
      const container = document.getElementById('experience-list');
      container.innerHTML = experiences.map((exp, i) => `
        <div class="section-item bg-gray-50 p-4 rounded-2xl">
          <div class="font-medium">${exp.role} @ ${exp.company}</div>
          <div class="text-sm text-gray-500">${exp.period}</div>
          <button onclick="removeExperience(${i})" class="text-red-600 text-xs mt-2">Remove</button>
        </div>
      `).join('');
    }

    function removeExperience(i) {
      experiences.splice(i, 1);
      renderExperienceList();
      updatePreview();
    }

    function improveWithAI() {
      alert("🚀 AI Improvement feature is ready!\n\nIn next update we'll connect real Grok / OpenAI API for bullet improvement.");
    }

    function loadSampleData() {
      document.getElementById('name').value = "Veenit Kumar";
      document.getElementById('title').value = "Full Stack Developer & AI Engineer";
      document.getElementById('email').value = "veenit@example.com";
      document.getElementById('phone').value = "+91 98765 43210";
      document.getElementById('summary').value = "Passionate Full Stack Developer with expertise in building scalable applications and integrating AI solutions.";

      experiences = [
        { company: "TechCorp India", role: "Senior Full Stack Developer", period: "2023 - Present", bullets: ["Led development of customer portal", "Improved performance by 45%"] },
        { company: "StartupX", role: "Software Engineer", period: "2022 - 2023", bullets: ["Built MVP from scratch"] }
      ];

      renderExperienceList();
      updatePreview();
    }

    function exportPDF() {
      window.print();
    }

    // Load saved data
    window.onload = () => {
      const saved = localStorage.getItem("resumeData");
      if (saved) {
        const d = JSON.parse(saved);
        document.getElementById('name').value = d.name || '';
        document.getElementById('title').value = d.title || '';
        document.getElementById('email').value = d.email || '';
        document.getElementById('phone').value = d.phone || '';
        document.getElementById('summary').value = d.summary || '';
        if (d.experiences) experiences = d.experiences;
      }
      renderExperienceList();
      updatePreview();
    };
  </script>
</body>
</html>
