<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumeFlow - AI Resume Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .hero-bg { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); }
  </style>
</head>
<body class="bg-zinc-50">

  <!-- Navbar -->
  <nav class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fas fa-file-alt text-indigo-600 text-3xl"></i>
        <span class="text-2xl font-bold">ResumeFlow</span>
      </div>
      <div class="flex items-center gap-8">
        <a href="#" class="hover:text-indigo-600">Templates</a>
        <a href="#" class="hover:text-indigo-600">Pricing</a>
        <button onclick="document.getElementById('builder').scrollIntoView({behavior:'smooth'})" 
                class="bg-indigo-600 text-white px-6 py-2.5 rounded-2xl font-medium hover:bg-indigo-700">
          Build Resume
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero Section (Inspired by Figma) -->
  <section class="hero-bg text-white py-24">
    <div class="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center">
      <div>
        <h1 class="text-6xl font-bold leading-tight mb-6">
          Create Professional<br>Resumes in Minutes
        </h1>
        <p class="text-xl text-indigo-100 mb-8">
          AI-powered resume builder with beautiful templates. Stand out from the crowd.
        </p>
        <button onclick="document.getElementById('builder').scrollIntoView({behavior:'smooth'})" 
                class="bg-white text-indigo-700 px-8 py-4 rounded-3xl text-lg font-semibold hover:bg-indigo-50 flex items-center gap-3">
          Start Building Free <i class="fas fa-arrow-right"></i>
        </button>
      </div>
      <div class="hidden md:block">
        <img src="https://picsum.photos/id/1015/600/400" alt="Resume Preview" class="rounded-3xl shadow-2xl">
      </div>
    </div>
  </section>

  <!-- Builder Section -->
  <div id="builder" class="max-w-7xl mx-auto p-6">
    <div class="flex h-[calc(100vh-120px)] border rounded-3xl overflow-hidden bg-white shadow-xl">
      
      <!-- Sidebar Editor -->
      <div class="w-96 border-r overflow-auto p-6 bg-zinc-50">
        <h2 class="text-2xl font-semibold mb-6 flex items-center gap-2">
          <i class="fas fa-edit"></i> Editor
        </h2>
        
        <div class="space-y-8">
          <div>
            <h3 class="font-medium mb-3">Personal Info</h3>
            <input id="name" placeholder="Full Name" class="w-full p-3 border rounded-2xl mb-3" oninput="updatePreview()">
            <input id="title" placeholder="Job Title" class="w-full p-3 border rounded-2xl mb-3" oninput="updatePreview()">
            <input id="email" placeholder="Email" class="w-full p-3 border rounded-2xl" oninput="updatePreview()">
          </div>

          <div>
            <h3 class="font-medium mb-3">Summary</h3>
            <textarea id="summary" rows="4" class="w-full p-3 border rounded-2xl" oninput="updatePreview()"></textarea>
            <button onclick="improveAI()" class="mt-3 text-indigo-600 text-sm font-medium flex items-center gap-1">
              <i class="fas fa-sparkles"></i> Improve with AI
            </button>
          </div>
        </div>
      </div>

      <!-- Live Preview -->
      <div class="flex-1 p-8 bg-zinc-100 overflow-auto flex items-center justify-center">
        <div id="preview" class="bg-white w-full max-w-2xl shadow-2xl min-h-[700px] p-12 rounded-3xl">
          <!-- JS injected content -->
        </div>
      </div>
    </div>
  </div>

  <script>
    function updatePreview() {
      const name = document.getElementById('name').value || "John Doe";
      const title = document.getElementById('title').value || "Software Engineer";
      const email = document.getElementById('email').value;
      const summary = document.getElementById('summary').value || "Passionate developer building exceptional digital experiences.";

      document.getElementById('preview').innerHTML = `
        <div class="text-center mb-10">
          <h1 class="text-5xl font-bold text-gray-900">${name}</h1>
          <p class="text-2xl text-indigo-600 mt-2">${title}</p>
          <p class="text-gray-600 mt-3">${email}</p>
        </div>
        <div class="prose max-w-none">
          <h2 class="text-lg uppercase tracking-widest text-gray-500 mb-4">PROFESSIONAL SUMMARY</h2>
          <p class="text-gray-700 leading-relaxed">${summary}</p>
        </div>
      `;
    }

    function improveAI() {
      alert("AI is working! ✨\n\nIn next step we'll connect real Grok API for smart suggestions.");
    }

    // Sample Data
    window.onload = () => {
      document.getElementById('name').value = "Veenit Kumar";
      document.getElementById('title').value = "Full Stack AI Developer";
      document.getElementById('email').value = "veenit@example.com";
      document.getElementById('summary').value = "Results-driven Full Stack Developer with expertise in React, Node.js, and AI technologies. Passionate about creating elegant solutions to complex problems.";
      updatePreview();
    };
  </script>
</body>
</html>
